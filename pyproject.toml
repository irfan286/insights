[project]
name = "insights"
authors = [
    { name = "Powerful Reporting Tool for Frappe Apps", email = "hello@frappe.io"}
]
description = "Open Source Business Intelligence Tool"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pandas~=2.3.3",
    "SQLAlchemy==2.0.41",
    "python-telegram-bot==21.4",
    "duckdb~=1.4.3",
    "sqlglot>=30.12.0,<31",
    "ibis-framework~=11.0.0",
    "ibis-framework[duckdb]",
    "ibis-framework[mysql]",
    "ibis-framework[sqlite]",
    "ibis-framework[clickhouse]",
    "ibis-framework[postgres]",
    # "ibis-framework[mssql]",
    # "ibis-framework[bigquery]",
    "psycopg[binary]",
    "xlsxwriter",
    # Direct import in insights/mcp/validate.py (Draft202012Validator). Declared here
    # rather than relied on transitively via frappe-mcp, so that vendoring frappe-mcp
    # (the documented exit strategy) cannot silently break argument validation.
    "jsonschema>=4.24.0,<5",
    # MCP protocol layer. Pinned to a FORK at a COMMIT SHA, never a branch name, so
    # `bench update` cannot move the transport underneath us.
    #
    # Never use PyPI frappe-mcp (0.1.0, a year stale, predates prompt support) and never
    # upstream frappe/mcp: its metadata pins Werkzeug==3.1.3 and pydantic~=2.11.7, which
    # do not overlap Frappe v16's 3.1.6 / 2.12.5. Because Frappe is installed editable,
    # pip does not reconsider its requirements and silently downgrades the WSGI layer
    # Frappe serves every request through -- then fails to build pydantic-core, which
    # ships no cp314 wheel at that version. See docs/mcp-IMPLEMENTATION.md §8 D.
    #
    # The fork's only diff from upstream 11d5076 is relaxing those two pins to ranges.
    # Upstream's own suite passes against Frappe v16's versions (67 passed). Tracked as
    # upstream issue #5.
    "frappe-mcp @ git+https://github.com/Irfan234-afif/frappe-mcp@bef8fbf8f1e2ad053c3956712612c18d355bde1d",
]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"

[project.optional-dependencies]
test = [
    "coverage~=7.10.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
coverage = "~=7.10.0"


[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "E731", # do not assign a lambda expression, use a def
    # "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[project.urls]
Homepage = "https://frappe.io/insights"
Repository = "https://github.com/frappe/insights.git"
"Bug Reports" = "https://github.com/frappe/insights/issues"
