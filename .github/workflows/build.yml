name: Build Container Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra Docker tag to publish (e.g. v16-0.1.0). Leave empty to skip."
        required: false
        default: ""
  push:
    branches:
      - version-3
      - v16-mcp
    tags:
      - "v*"
      - "insights-v16-*"

jobs:
  build:
    name: Build & Push

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # bench init pulls two full app trees, a python venv and ~1 GB of
      # node_modules, then the layer cache is exported on top. A default runner
      # has run out of disk doing less. These are preinstalled toolchains this
      # build never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The image builds Insights from a git ref named in docker/apps.json, so
      # the Docker layer cache cannot see when that ref moves -- and the ref IS
      # moved deliberately (the pin tag is force-updated when a fix lands).
      # Keying CACHE_BUST on the resolved commit gives a cache hit when the pin
      # is unchanged and a guaranteed rebuild the moment it moves. Keying it on
      # the file contents would not: the filename stays identical when the tag
      # is repointed, which is exactly how a build ships stale application code.
      - name: Resolve the Insights pin
        id: pin
        run: |
          set -euo pipefail
          URL=$(jq -r '.[0].url' docker/apps.json)
          REF=$(jq -r '.[0].branch' docker/apps.json)
          # ^{} dereferences an annotated tag to the commit it points at.
          SHA=$(git ls-remote "$URL" "refs/tags/${REF}^{}" | cut -f1)
          [ -n "$SHA" ] || SHA=$(git ls-remote "$URL" "refs/tags/${REF}" | cut -f1)
          [ -n "$SHA" ] || SHA=$(git ls-remote "$URL" "refs/heads/${REF}" | cut -f1)
          if [ -z "$SHA" ]; then
            echo "::error::docker/apps.json points at '${REF}' in ${URL}, which does not resolve."
            exit 1
          fi
          echo "Insights pin ${REF} -> ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` stays reserved for version-3, the branch the running v15
      # production stack builds from. A v16 image must never claim it.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: irfan33/insights
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/version-3' }}

      # amd64 only. arm64 here would run under QEMU, and this dependency set
      # (pyarrow, duckdb, psycopg, a full vite build) is both slow and prone to
      # emulation faults in exactly the native code that is already the prime
      # suspect for the DuckDB SIGSEGV. Both deploy targets are amd64.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CACHE_BUST=${{ steps.pin.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Insights pin | \`$(jq -r '.[0].branch' docker/apps.json)\` |"
            echo "| Resolved commit | \`${{ steps.pin.outputs.sha }}\` |"
            echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
